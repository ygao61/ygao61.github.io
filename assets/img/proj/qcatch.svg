<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="A barcode-rank knee plot with an automatically placed cell-calling cutoff">
  <rect width="400" height="250" fill="#f6f7f9"/>
  <g stroke="#e2e6ec" stroke-width="1">
    <line x1="48" y1="60"  x2="368" y2="60"/>
    <line x1="48" y1="110" x2="368" y2="110"/>
    <line x1="48" y1="160" x2="368" y2="160"/>
  </g>
  <line x1="48" y1="200" x2="368" y2="200" stroke="#8b95a5" stroke-width="1.5"/>
  <line x1="48" y1="34"  x2="48"  y2="200" stroke="#8b95a5" stroke-width="1.5"/>
  <!-- knee curve -->
  <path d="M48 46 C 96 48, 126 54, 150 70 C 168 84, 176 132, 192 160 C 208 182, 250 190, 368 194"
        fill="none" stroke="#2f6f62" stroke-width="2.5" stroke-linecap="round"/>
  <!-- cutoff -->
  <line x1="182" y1="34" x2="182" y2="200" stroke="#c2571a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="182" cy="141" r="4.5" fill="#c2571a"/>
  <g font-family="ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7482">
    <text x="192" y="46" fill="#c2571a">cell-calling cutoff</text>
    <text x="60" y="222">barcode rank</text>
    <text x="16" y="30">UMI</text>
  </g>
  <g fill="#2f6f62" font-family="ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif" font-size="11">
    <text x="66" y="80">retained</text>
  </g>
  <g fill="#9aa3b0" font-family="ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif" font-size="11">
    <text x="258" y="178">ambient</text>
  </g>
</svg>
